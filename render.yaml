services:
  - type: web
    name: caughtoffside-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: ALLOW_MEMORY_DB
        value: 'false'
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: 'true'
